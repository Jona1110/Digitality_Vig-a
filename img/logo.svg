<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente principal moderno (Azul a Verde esmeralda Digitality) -->
    <linearGradient id="digitalityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #f8fafc;
      letter-spacing: 0.5px;
    }
    .brand-subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #10b981;
      letter-spacing: 2px;
    }
    .shield-bg {
      fill: #1e293b;
      stroke: url(#digitalityGrad);
      stroke-width: 3;
    }
  </style>

  <!-- Símbolo / Isotipo -->
  <g transform="translate(10, 10)">
    <!-- Escudo base -->
    <path class="shield-bg" d="M50 5 L90 20 C90 55 70 85 50 100 C30 85 10 55 10 20 Z" filter="url(#glow)" />
    
    <!-- Ondas de radar / Alerta internas -->
    <path d="M50 35 A 15 15 0 0 1 65 50" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <path d="M50 25 A 25 25 0 0 1 75 50" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    
    <!-- Centro / Ubicación -->
    <circle cx="50" cy="50" r="6" fill="url(#digitalityGrad)" />
  </g>

  <!-- Tipografía del Logotipo -->
  <text x="125" y="55" class="brand-title">DIGITALITY</text>
  <text x="127" y="82" class="brand-subtitle">VIGÍA</text>
</svg>
